<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircuitCart dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#F2F5F4; --surface:#FFFFFF; --ink:#12202A; --muted:#546670; --line:#D5DEE0; --soft:#E8EEEE;
  --rail:#0E2A2B; --rail-ink:#C8DDD9; --rail-on:#FFFFFF; --rail-hi:#17403F;
  --brand:#0B7A67; --brand-ink:#FFFFFF; --alert:#B3361F;
  --info:#2B6CB0; --ok:#2F855A; --attn:#A86A0E; --closed:#66767F;
  --code:#EDF2F2; --shadow:0 12px 40px rgba(14,42,43,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0C1517; --surface:#121E21; --ink:#E6EFEE; --muted:#92A8AB; --line:#27393D; --soft:#18272A;
    --rail:#081012; --rail-hi:#12262A; --brand:#35C2A5; --brand-ink:#04211B; --alert:#FF8A73;
    --info:#6FA8F0; --ok:#4FC38A; --attn:#E3B04B; --closed:#9AA8B3; --code:#0F1A1C; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --paper:#0C1517; --surface:#121E21; --ink:#E6EFEE; --muted:#92A8AB; --line:#27393D; --soft:#18272A;
  --rail:#081012; --rail-hi:#12262A; --brand:#35C2A5; --brand-ink:#04211B; --alert:#FF8A73;
  --info:#6FA8F0; --ok:#4FC38A; --attn:#E3B04B; --closed:#9AA8B3; --code:#0F1A1C; --shadow:0 12px 40px rgba(0,0,0,.5);
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--paper); color:var(--ink); font:15px/1.5 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric:tabular-nums; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--brand); }
:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
h1,h2,h3,p { margin:0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- shell ---------- */
.shell { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100%; }
.rail { background:var(--rail); color:var(--rail-ink); display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh; }
.logo { display:flex; gap:10px; align-items:center; font-weight:800; font-size:18px; color:var(--rail-on); padding:0 8px 22px; }
.nav { display:flex; flex-direction:column; gap:2px; }
.nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--rail-ink); text-decoration:none; font-weight:600; }
.nav a:hover { background:var(--rail-hi); }
.nav a[aria-current="page"] { background:var(--rail-hi); color:var(--rail-on); box-shadow:inset 3px 0 0 #3FD0B3; }
.nav svg { flex:none; }
.who { margin-top:auto; padding:12px 10px 0; border-top:1px solid #ffffff1f; font-size:13px; }
.who b { display:block; color:var(--rail-on); font-size:14px; }
.who span { display:block; opacity:.75; overflow:hidden; text-overflow:ellipsis; }
.main { min-width:0; display:flex; flex-direction:column; }
.top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 32px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.top h1 { font-size:26px; letter-spacing:-.02em; font-weight:800; }
.top .tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.pill { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; font-size:13px; color:var(--muted); background:var(--surface); }
.pill i { width:8px; height:8px; border-radius:50%; background:var(--ok); }
.pill.bad i { background:var(--alert); }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:7px 13px; cursor:pointer; font-weight:600; }
.btn:hover { border-color:var(--brand); }
.btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
.btn.small { padding:4px 10px; font-size:13px; }
.btn[disabled] { opacity:.55; cursor:not-allowed; }
.assistant-fab { position:fixed; right:24px; bottom:24px; z-index:30; display:inline-flex; align-items:center; gap:9px; border:0; border-radius:999px; padding:13px 19px; background:var(--brand); color:var(--brand-ink); box-shadow:0 8px 24px rgba(0,0,0,.24); font-weight:700; cursor:pointer; }
.assistant-fab:hover { filter:brightness(1.08); transform:translateY(-1px); }
.assistant-fab[hidden] { display:none; }
.link { background:none; border:0; padding:0; color:var(--brand); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
#view { padding:26px 32px 56px; flex:1; min-width:0; }
.lede { font-size:19px; line-height:1.4; max-width:62ch; margin:6px 0 26px; }
.lede b { font-weight:700; }
.cols { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:44px; align-items:start; }
.section + .section { margin-top:34px; }
.section > h2 { font-size:17px; font-weight:700; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.section > h2 small { font-weight:500; color:var(--muted); font-size:13px; }
.empty { color:var(--muted); padding:14px 0; max-width:56ch; }

/* ---------- status ---------- */
.st { display:inline-flex; align-items:center; gap:7px; font-weight:600; white-space:nowrap; }
.st::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--closed); flex:none; }
.st-active::before { background:var(--info); } .st-done::before { background:var(--ok); }
.st-attn::before { background:var(--attn); border-radius:2px; transform:rotate(45deg); } .st-closed::before { background:transparent; border:2px solid var(--closed); }
.txt-attn { color:var(--attn); font-weight:700; } .txt-bad { color:var(--alert); font-weight:600; }

/* ---------- order trace (the circuit motif) ---------- */
.trace { list-style:none; display:flex; margin:16px 0 4px; padding:0; }
.trace li { flex:1; position:relative; text-align:center; font-size:12.5px; color:var(--muted); }
.trace li::before { content:""; position:absolute; top:7px; left:-50%; width:100%; height:3px; background:var(--line); }
.trace li:first-child::before { display:none; }
.trace .pad { display:block; width:17px; height:17px; border-radius:50%; margin:0 auto 6px; background:var(--paper); border:3px solid var(--line); position:relative; z-index:1; }
.trace li.done::before, .trace li.now::before { background:var(--brand); }
.trace li.done .pad { background:var(--brand); border-color:var(--brand); }
.trace li.now .pad { border-color:var(--brand); }
.trace li.now { color:var(--ink); font-weight:700; }
.trace li.now.late .pad, .trace li.hold .pad { border-color:var(--attn); }
.trace li.now.late::before { background:linear-gradient(90deg,var(--brand),var(--attn)); }
.trace li.now .pad::after { content:""; position:absolute; inset:-7px; border-radius:50%; border:2px solid currentColor; color:var(--brand); opacity:0; animation:ping 2.4s ease-out infinite; }
.trace li.now.late .pad::after { color:var(--attn); }
@keyframes ping { 0% { transform:scale(.5); opacity:.7; } 70%,100% { transform:scale(1.15); opacity:0; } }
@media (prefers-reduced-motion: reduce) { .trace li.now .pad::after { animation:none; } }
.tracenote { margin:14px 0 4px; color:var(--muted); font-size:14px; padding-left:12px; border-left:3px solid var(--line); }

/* ---------- lists ---------- */
.row { display:block; padding:16px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.row:hover .rname { text-decoration:underline; text-underline-offset:3px; }
.rowtop { display:flex; justify-content:space-between; gap:16px; align-items:baseline; flex-wrap:wrap; }
.rname { font-weight:700; font-size:16px; }
.sub { color:var(--muted); font-size:13.5px; }
.todo { padding:12px 0; border-bottom:1px solid var(--line); }
.todo b { display:block; } .todo .sub { margin:2px 0 6px; }
.bar { display:flex; gap:2px; height:22px; margin:14px 0 10px; }
.bar span { display:block; min-width:6px; border-radius:2px; }
.bar span:first-child { border-radius:8px 2px 2px 8px; } .bar span:last-child { border-radius:2px 8px 8px 2px; } .bar span:only-child { border-radius:8px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 20px; font-size:14px; }
.legend i { display:inline-block; width:10px; height:10px; margin-right:7px; border-radius:2px; }
.asks { display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding-top:10px; }

/* ---------- tables ---------- */
.filters { display:flex; flex-wrap:wrap; gap:8px 8px; align-items:center; margin-bottom:12px; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 13px; cursor:pointer; font-weight:600; font-size:14px; }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.field { background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 11px; min-width:0; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-weight:600; color:var(--muted); font-size:13px; padding:8px 12px 8px 0; border-bottom:2px solid var(--line); }
td { padding:13px 12px 13px 0; border-bottom:1px solid var(--line); vertical-align:top; }
tbody tr { cursor:pointer; } tbody tr:hover td { background:var(--soft); }
td.num, th.num { text-align:right; padding-right:0; }
.tablewrap { overflow-x:auto; }

/* ---------- assistant ---------- */
.assist { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:0; height:calc(100vh - 118px); min-height:480px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); }
.chat { display:flex; flex-direction:column; min-width:0; min-height:0; }
.log { flex:1; overflow-y:auto; padding:22px 24px; display:flex; flex-direction:column; gap:18px; }
.msg { max-width:72ch; }
.msg.user { align-self:flex-end; background:var(--brand); color:var(--brand-ink); padding:9px 15px; border-radius:16px 16px 4px 16px; max-width:80%; }
.msg.bot { padding-left:14px; border-left:3px solid var(--brand); }
.msg.err { padding-left:14px; border-left:3px solid var(--alert); color:var(--alert); font-weight:600; }
.msg p { margin:0 0 8px; } .msg p:last-child { margin:0; } .msg ul { margin:4px 0 8px; padding-left:20px; }
.msg code { background:var(--code); padding:1px 5px; border-radius:4px; }
.msgmeta { margin-top:6px; font-size:12.5px; color:var(--muted); }
.typing span { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:4px; animation:blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay:.2s; } .typing span:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation:none; } }
.suggest { padding:0 24px 10px; display:flex; flex-wrap:wrap; gap:8px; }
.composer { display:flex; gap:10px; padding:14px 24px 18px; border-top:1px solid var(--line); }
.composer textarea { flex:1; resize:none; height:46px; padding:11px 13px; background:var(--paper); border:1px solid var(--line); border-radius:10px; }
.activity { border-left:1px solid var(--line); background:var(--paper); overflow-y:auto; padding:18px 18px 24px; min-width:0; }
.activity h2 { font-size:15px; font-weight:700; margin-bottom:4px; }
.calls { list-style:none; margin:14px 0 0; padding:0; }
.calls li { position:relative; padding:0 0 18px 26px; }
.calls li::before { content:""; position:absolute; left:6px; top:14px; bottom:-2px; width:3px; background:var(--brand); }
.calls li:last-child::before { display:none; }
.calls li::after { content:""; position:absolute; left:0; top:2px; width:15px; height:15px; border-radius:50%; background:var(--paper); border:3px solid var(--brand); }
.calls li.bad::after { border-color:var(--alert); }
.cname { font-weight:700; }
.args { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; margin:4px 0; font-size:13px; }
.args dt { color:var(--muted); } .args dd { margin:0; word-break:break-word; }
.cres { font-size:13.5px; } .cres.bad { color:var(--alert); font-weight:600; }
details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:4px; }
pre { background:var(--code); border-radius:8px; padding:9px 11px; margin:6px 0 0; white-space:pre-wrap; word-break:break-word; max-height:240px; overflow:auto; font:12px/1.45 ui-monospace, Menlo, Consolas, monospace; }

/* ---------- shop ---------- */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:0 28px; }
.prod { padding:16px 0 18px; border-top:2px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.prod:hover { border-top-color:var(--brand); }
.prod-image { display:block; width:100%; height:150px; object-fit:cover; border-radius:10px; background:var(--soft); }
.category-strip { display:flex; gap:10px; overflow-x:auto; padding:4px 1px 12px; margin:4px 0 10px; scrollbar-width:thin; }
.category-card { flex:0 0 118px; display:flex; flex-direction:column; gap:6px; text-align:left; padding:7px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; }
.category-card:hover,.category-card[aria-pressed="true"] { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand); }
.category-card img { display:block; width:100%; height:64px; object-fit:cover; border-radius:6px; }
.category-card span { font-size:12px; line-height:1.25; font-weight:600; }
.prod h3 { font-size:16.5px; line-height:1.25; font-weight:700; }
.price { font-size:22px; font-weight:800; letter-spacing:-.01em; }
.specs { display:flex; flex-wrap:wrap; gap:5px; margin:0; padding:0; list-style:none; }
.specs li { font-size:12.5px; background:var(--soft); border-radius:6px; padding:2px 8px; }
.prodfoot { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:auto; padding-top:6px; }
.cmp { display:flex; gap:6px; align-items:center; font-size:13.5px; cursor:pointer; }
.cmpbar { position:fixed; left:50%; transform:translateX(-50%); bottom:20px; background:var(--ink); color:var(--paper); padding:10px 14px 10px 18px; border-radius:12px; display:flex; gap:14px; align-items:center; box-shadow:var(--shadow); z-index:20; }
.cmpbar .btn { color:var(--ink); }

/* ---------- evaluation ---------- */
.meter { display:grid; grid-template-columns:240px minmax(0,1fr) 64px; gap:14px; align-items:center; padding:9px 0; }
.meter .track { height:14px; background:var(--soft); border-radius:7px; overflow:hidden; }
.meter .fill { height:100%; background:var(--brand); border-radius:7px; }
.meter b { text-align:right; font-weight:800; }

/* ---------- drawer + dialog ---------- */
.scrim { position:fixed; inset:0; background:#0008; z-index:30; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--surface); z-index:31; box-shadow:var(--shadow); padding:24px 26px; overflow-y:auto; }
.drawer h2 { font-size:21px; letter-spacing:-.01em; }
.facts { display:grid; grid-template-columns:150px 1fr; gap:8px 14px; margin:18px 0; }
.facts dt { color:var(--muted); } .facts dd { margin:0; }
.xbtn { float:right; }
dialog { border:0; border-radius:16px; padding:24px 26px; width:min(720px,94vw); background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
dialog::backdrop { background:#0008; }
dialog h2 { font-size:20px; margin-bottom:10px; }
.verdict { padding:12px 14px; border-left:4px solid var(--closed); background:var(--soft); margin:14px 0; }
.verdict.yes { border-color:var(--ok); } .verdict.no { border-color:var(--alert); }
.radio { display:flex; gap:8px; align-items:center; margin:6px 0; }
.cmpTable td, .cmpTable th { vertical-align:top; padding:9px 10px 9px 0; }
.cmpTable { font-size:14px; }

/* ---------- small screens ---------- */
@media (max-width:1060px) { .cols { grid-template-columns:1fr; gap:30px; } .assist { grid-template-columns:1fr; height:auto; } .chat { height:70vh; } .activity { border-left:0; border-top:1px solid var(--line); } }
@media (max-width:860px) {
  .shell { grid-template-columns:1fr; }
  .rail { position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; padding:6px; z-index:25; }
  .logo, .who { display:none; }
  .nav { flex-direction:row; width:100%; justify-content:space-between; }
  .nav a { flex-direction:column; gap:2px; font-size:11px; padding:6px 4px; flex:1; align-items:center; text-align:center; }
  .nav a[aria-current="page"] { box-shadow:inset 0 3px 0 #3FD0B3; }
  .top { padding:14px 16px; } .top h1 { font-size:22px; } #view { padding:18px 16px 96px; }
  .meter { grid-template-columns:1fr 54px; } .meter .track { grid-column:1 / -1; grid-row:2; }
  table.resp thead { display:none; } table.resp, table.resp tbody, table.resp tr, table.resp td { display:block; }
  table.resp tr { padding:12px 0; border-bottom:1px solid var(--line); } table.resp td { border:0; padding:2px 0; } table.resp td.num { text-align:left; }
  .cmpbar { bottom:78px; }
  .assistant-fab { right:16px; bottom:84px; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22h8l4-12h6l3 12h5" fill="none" stroke="#3FD0B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="3" cy="22" r="2.6" fill="#0E2A2B" stroke="#3FD0B3" stroke-width="2"/><circle cx="29" cy="22" r="2.6" fill="#3FD0B3"/></svg>
      CircuitCart
    </div>
    <div class="nav" id="nav"></div>
    <div class="who" id="who"></div>
  </nav>
  <div class="main">
    <header class="top">
      <h1 id="title">Shop</h1>
      <div class="tools">
        <span class="pill" id="llmPill"><i></i><span>checking AI model</span></span>
        <button class="btn small" id="logout" type="button">Sign out</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<div id="overlay"></div>
<button class="assistant-fab" id="assistantFab" type="button" aria-label="Open shopping assistant">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
  Ask assistant
</button>
<dialog id="dlg"></dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const S = { me: null, orders: null, chat: [], activity: null, busy: false, selected: new Set(),
            shop: { q: "", category: "", brand: "", max_price: "", min_rating: "", sort: "rating_desc", in_stock: false, keywords: "" },
            orderFilter: "all", orderSearch: "" };

/* ---------- helpers ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const inr = (n) => "₹" + Number(n).toLocaleString("en-IN");
const plural = (n, a, b) => n + " " + (n === 1 ? a : b);
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Request failed."), { data: j, status: r.status });
  return j;
}
const post = (url, data) => api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}) });

function md(text) {
  let html = "", inList = false;
  const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  for (const raw of esc(text).split("\n")) {
    const li = raw.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/), h = raw.match(/^#{1,4}\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(li[1]) + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (h) html += "<p><b>" + inline(h[1]) + "</b></p>"; else if (raw.trim()) html += "<p>" + inline(raw) + "</p>";
  }
  return html + (inList ? "</ul>" : "");
}

const ICON = {
  overview: '<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  assistant: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  orders: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  shop: '<path d="M3 12l9-9h8v8l-9 9z"/><circle cx="15.5" cy="8.5" r="1.4"/>',
  returns: '<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/>',
  evaluation: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
};

/* ---------- order helpers ---------- */
function stateOf(o) {
  if (o.order_status === "On Hold" || o.is_delayed) return "attn";
  if (["Processing", "Shipped", "Out for Delivery"].includes(o.order_status)) return "active";
  if (o.order_status === "Delivered") return "done";
  return "closed";
}
const STATE_NAME = { active: "On the way", done: "Delivered", attn: "Needs attention", closed: "Closed" };
const STATE_VAR = { active: "--info", done: "--ok", attn: "--attn", closed: "--closed" };
const statusBadge = (o) => `<span class="st st-${stateOf(o)}">${esc(o.order_status)}${o.is_delayed ? " (late)" : ""}</span>`;
const deliveryText = (o) => o.order_status === "Delivered" ? (o.delivered_date ? "Delivered " + fmtDate(o.delivered_date) : "Delivered (date unavailable)")
  : o.is_delayed ? `<span class="txt-attn">${plural(o.days_late, "day", "days")} late</span>`
  : o.expected_delivery_date && !["Cancelled", "Returned", "On Hold"].includes(o.order_status) ? "Expected " + fmtDate(o.expected_delivery_date)
  : o.order_status === "On Hold" ? "Not scheduled" : "None";

function tracker(o) {
  if (o.order_status === "Cancelled") return `<p class="tracenote">Cancelled before delivery. ${esc(refundShort(o))}</p>`;
  if (o.order_status === "Returned") return `<p class="tracenote">${o.delivered_date ? "Delivered " + fmtDate(o.delivered_date) + ", then returned." : "This order is marked as returned; its delivery date is unavailable."} ${esc(refundShort(o))}</p>`;
  const steps = ["Processing", "Shipped", "Out for delivery", "Delivered"];
  const idx = { "On Hold": -1, "Processing": 0, "Shipped": 1, "Out for Delivery": 2, "Delivered": 3 }[o.order_status];
  const hold = o.order_status === "On Hold";
  return `<ol class="trace" aria-label="Order progress: ${esc(o.order_status)}">` + steps.map((s, i) => {
    const cls = hold && i === 0 ? "hold" : i < idx ? "done" : i === idx ? (idx === 3 ? "done" : "now" + (o.is_delayed ? " late" : "")) : "";
    return `<li class="${cls}"><i class="pad"></i>${s}</li>`;
  }).join("") + `</ol>` + (hold ? `<p class="tracenote">On hold: payment ${esc(o.payment_status.toLowerCase())}. It ships once payment is complete.</p>` : "");
}
function refundShort(o) {

}

async function sendChat(text) {

  const c1 = colors[hash % colors.length], c2 = colors[(hash + 2) % colors.length];
  const label = safeTitle.length > 34 ? safeTitle.slice(0, 31) + "…" : safeTitle;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="640" height="360" rx="24" fill="#102427"/><circle cx="525" cy="45" r="175" fill="url(#g)" opacity=".72"/><circle cx="85" cy="340" r="180" fill="${c2}" opacity=".32"/><rect x="24" y="24" width="592" height="312" rx="20" fill="url(#g)" opacity=".2"/><text x="320" y="${compact ? "190" : "188"}" text-anchor="middle" dominant-baseline="middle" font-size="${compact ? "112" : "138"}" font-family="'Segoe UI Emoji','Apple Color Emoji',sans-serif">${icon}</text>${compact ? "" : `<text x="320" y="286" text-anchor="middle" fill="#F3F8F7" font-size="23" font-family="Arial,sans-serif" font-weight="700">${label}</text><text x="320" y="320" text-anchor="middle" fill="#D4E5E2" font-size="15" font-family="Arial,sans-serif">${esc(category)}</text>`}</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function productArt(product) { return artFor(product.category, product.product_name); }
function categoryArt(category) { return artFor(category, category, true); }
function renderCmpBar() {
  const host = $("#cmpHost"); if (!host) return; const n = S.selected.size;
  host.innerHTML = n ? `<div class="cmpbar"><span>${plural(n, "product", "products")} selected</span><button class="btn small" id="doCmp" ${n < 2 ? "disabled" : ""}>Compare</button><button class="link" id="clrCmp" style="color:inherit">Clear</button></div>` : "";
  const c = $("#doCmp"); if (c) c.onclick = showCompare; const x = $("#clrCmp"); if (x) x.onclick = () => { S.selected.clear(); $$("[data-cmp]").forEach((i) => i.checked = false); renderCmpBar(); };
}
async function showCompare() {
  try {
    const d = await api("/api/compare?ids=" + [...S.selected].join(","));
    openDialog(`<h2>Compare products</h2><div class="tablewrap"><table class="cmpTable"><thead><tr><th></th>${d.products.map((p) => `<th>${esc(p.product_name)}</th>`).join("")}</tr></thead><tbody>
      <tr><th>Price</th>${d.products.map((p) => `<td><b>${esc(p.price)}</b></td>`).join("")}</tr>
      <tr><th>Rating</th>${d.products.map((p) => `<td>${p.rating.toFixed(1)} out of 5</td>`).join("")}</tr>
      <tr><th>Availability</th>${d.products.map((p) => `<td>${esc(p.availability)}</td>`).join("")}</tr>
      <tr><th>Specifications</th>${d.products.map((p) => `<td>${p.specifications.split(", ").map(esc).join("<br>")}</td>`).join("")}</tr></tbody></table></div>
      <p style="margin-top:12px"><b>Cheapest:</b> ${esc(d.highlights.cheapest)}. <b>Best rated:</b> ${esc(d.highlights.highest_rated)}.</p><p style="margin-top:14px"><button class="btn" id="dlgClose">Close</button></p>`);
  } catch (e) { openDialog(`<h2>Cannot compare</h2><p>${esc(e.message)}</p><p style="margin-top:14px"><button class="btn" id="dlgClose">Close</button></p>`); }
}

function viewReturns() { return `<p class="empty" id="retLoad">Loading your returns and refunds...</p><div id="retBody"></div>`; }
async function loadReturns() {
  const [r, pol] = await Promise.all([api("/api/returns"), api("/api/policy")]);
  const delivered = S.orders.filter((o) => o.order_status === "Delivered" && o.return_status === "None");
  $("#retLoad").remove();
  $("#retBody").innerHTML = `
  <section class="section"><h2>Your returns and refunds <small>${plural(r.returns.length, "item", "items")}</small></h2>
    ${r.returns.length ? r.returns.map((x) => `<div class="row" style="cursor:default"><div class="rowtop"><span class="rname">${esc(x.product_name)}</span><span><b>${x.refund.refund_amount ? esc(x.refund.refund_amount) : "Amount unavailable"}</b></span></div>
      <div class="sub">Order ${x.order_id}, ${esc(x.return_status === "None" ? x.order_status : x.return_status)}</div>
      <p style="margin-top:6px">${esc(x.refund.message)}</p>${x.refund.expected_by ? `<p class="sub">Expected by ${fmtDate(x.refund.expected_by)}. Method: ${esc(x.refund.refund_method)}</p>` : ""}</div>`).join("")
      : `<p class="empty">No returns or refunds yet. When you return something, you can follow it here.</p>`}
  </section>
  <section class="section"><h2>Can I return something? <small>${plural(delivered.length, "delivered order", "delivered orders")}</small></h2>
    ${delivered.length ? `<p class="sub">The order CSV does not include actual delivery dates, so the assistant cannot verify a return window.</p>` + delivered.map((o) => `<div class="todo" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>${esc(o.product_name)}</b><span class="sub">Order ${esc(o.order_id)}, delivery date unavailable</span></div><button class="btn small" data-elig="${esc(o.order_id)}">Check eligibility</button></div>`).join("") : `<p class="empty">No delivered orders waiting for a return decision.</p>`}
  </section>
  <section class="section"><h2>Return policy by category</h2>
    <div class="tablewrap"><table class="resp"><thead><tr><th>Category</th><th>Change of mind</th><th>Defective or damaged</th><th>Refund time</th><th>Item must be</th></tr></thead><tbody>
    ${pol.all_categories.map((c) => `<tr style="cursor:default"><td><b>${esc(c.category)}</b></td><td>${c.change_of_mind_window_days} days</td><td>${c.defective_or_damaged_window_days} days</td><td>${c.refund_processing_business_days} business days</td><td>${esc(c.conditions)}</td></tr>`).join("")}</tbody></table></div>
    <details style="margin-top:14px"><summary>General rules</summary><ul>${Object.values(pol.general_rules).map((t) => `<li>${esc(t)}</li>`).join("")}</ul></details>
    <p class="sub" style="margin-top:12px">These demo policy values are synthetic and are not verified retailer policies.</p>
    <p style="margin-top:20px"><button class="link" id="resetDemo">Reset your return requests created in this demo</button></p>
  </section>`;
  const rb = $("#resetDemo"); if (rb) rb.onclick = async () => { await post("/api/demo/reset-returns"); S.orders = (await api("/api/orders")).orders; route(); };
}
function openEligibility(orderId) {
  const o = S.orders.find((x) => x.order_id === orderId);
  openDialog(`<h2>Return check for ${orderId}</h2><p class="sub">${esc(o ? o.product_name : "")}</p>
    <fieldset style="border:0;padding:0;margin:14px 0 0"><legend class="sr">Why do you want to return it?</legend>
      <label class="radio"><input type="radio" name="why" value="changed my mind" checked> I changed my mind</label>
      <label class="radio"><input type="radio" name="why" value="defective or damaged"> It is defective, damaged or the wrong item</label></fieldset>
    <div id="verdict"></div><p style="margin-top:14px;display:flex;gap:10px"><button class="btn primary" id="doCheck">Check</button><button class="btn" id="dlgClose">Close</button></p>`);
  const run = async () => {
    const why = $('input[name="why"]:checked').value, host = $("#verdict");
    try {
      const d = await api(`/api/orders/${orderId}/eligibility?reason=` + encodeURIComponent(why));
      host.innerHTML = `<div class="verdict ${d.eligible ? "yes" : "no"}"><b>${d.eligible ? "You can return this" : "This cannot be returned"}</b><p style="margin-top:4px">${esc(d.message)}</p>
        ${d.eligible ? `<p style="margin-top:10px"><button class="btn primary" id="doReturn">Request this return</button></p>` : ""}</div>`;
      const b = $("#doReturn"); if (b) b.onclick = async () => {
        b.disabled = true;
        try { const r = await post(`/api/orders/${orderId}/return`, { reason: why }); S.orders = (await api("/api/orders")).orders;
          host.innerHTML = `<div class="verdict yes"><b>Return requested</b><p style="margin-top:4px">${esc(r.message)}</p></div>`; }
        catch (e) { host.innerHTML = `<div class="verdict no">${esc(e.message)}</div>`; }
      };
    } catch (e) { host.innerHTML = `<div class="verdict no">${esc(e.message)}</div>`; }
  };
  $("#doCheck").onclick = run; run();
}

function viewEvaluation() { return `<p class="empty" id="evLoad">Loading results...</p><div id="evBody"></div>`; }
async function loadEvaluation() {
  const d = await api("/api/evaluation"); $("#evLoad").remove(); const host = $("#evBody");
  if (!d.run) { host.innerHTML = `<p class="empty"><b>No evaluation has been run yet.</b><br>In the VS Code terminal run <code>python -m evaluation.run_evaluation</code>. The results appear here when it finishes.</p>`; return; }
  const m = d.metrics, o = m.overall, meter = (name, v, note) => `<div class="meter"><span>${name}${note ? `<br><span class="sub">${note}</span>` : ""}</span><div class="track" role="img" aria-label="${name} ${v ?? 0} percent"><div class="fill" style="width:${v ?? 0}%"></div></div><b>${v ?? "n/a"}%</b></div>`;
  host.innerHTML = `<p class="lede">${o.tests} test requests were run against <b>${esc(d.run === "oracle" ? "the no-LLM self-test" : d.run)}</b>.${d.run === "oracle" ? " Run the evaluation with your model to see real results." : ""}</p>
  <section class="section"><h2>The three measures from the brief</h2>
    ${meter("Tool-selection accuracy", o.tool_selection_accuracy_pct, "Right tool, no wrong tool, right order id")}
    ${meter("Constraint and policy compliance", o.constraint_or_policy_compliance_pct, `Checked on ${o.compliance_tests} tests that have a rule`)}
    ${meter("Task completion rate", o.task_completion_rate_pct, "Answer given with the key facts")}</section>
  <section class="section"><h2>By type of request</h2><div class="tablewrap"><table class="resp"><thead><tr><th>Type</th><th class="num">Tests</th><th class="num">Tool selection</th><th class="num">Compliance</th><th class="num">Completion</th><th class="num">Avg time</th></tr></thead><tbody>
    ${[["Product discovery", m.product_discovery], ["Customer service", m.customer_service]].map(([n, b]) => `<tr style="cursor:default"><td><b>${n}</b></td><td class="num">${b.tests}</td><td class="num">${b.tool_selection_accuracy_pct}%</td><td class="num">${b.constraint_or_policy_compliance_pct}%</td><td class="num">${b.task_completion_rate_pct}%</td><td class="num">${b.avg_latency_s} s</td></tr>`).join("")}</tbody></table></div></section>
  <section class="section"><h2>Tests that failed <small>${d.failures.length}</small></h2>
    ${d.failures.length ? d.failures.map((f) => `<div class="todo"><b>${esc(f.id)}: ${esc(f.request)}</b><p class="sub">${esc(f.notes)}</p></div>`).join("") : `<p class="empty">Every test passed.</p>`}</section>`;
}

/* ---------- dialog ---------- */
function openDialog(html) { const d = $("#dlg"); d.innerHTML = html; if (!d.open) d.showModal(); const c = $("#dlgClose"); if (c) c.onclick = () => d.close(); }

/* ---------- router ---------- */
async function route() {
  const [, page = "shop", param] = (location.hash || "#/shop").split("/");
  const name = ["shop", "orders", "assistant"].includes(page) ? page : "shop";
  $("#title").textContent = TITLES[name]; document.title = TITLES[name] + " | CircuitCart";
  $("#nav").innerHTML = PAGES.map(([k, n]) => `<a href="#/${k}" ${k === name ? 'aria-current="page"' : ""}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>${n}</a>`).join("");
  $("#assistantFab").hidden = name === "assistant";
  const v = $("#view");
  if (name === "assistant") { v.innerHTML = viewAssistant(); bindAssistant(); $(".activity h2").insertAdjacentHTML("afterend", ""); const t = $(".top .tools"); if (!$("#newChat")) { t.insertAdjacentHTML("afterbegin", resetChatBtn()); $("#newChat").onclick = async () => { await post("/api/chat/reset"); S.chat = []; S.activity = null; renderLog(); renderActivity(); }; } }
  else if (name === "orders") { v.innerHTML = viewOrders(); if (param) openDrawer(param); }
  else if (name === "shop") { v.innerHTML = viewShop(); bindShop(); loadShop(); }
  if (name !== "assistant" && $("#newChat")) $("#newChat").remove();
  if (name !== "orders") $("#overlay").innerHTML = "";
}
function bindShop() {
  const form = $("#shopForm");
  form.addEventListener("input", () => {
    const fd = new FormData(form), f = S.shop;
    ["q", "category", "brand", "max_price", "min_rating", "sort", "keywords"].forEach((k) => f[k] = fd.get(k) || (k === "sort" ? "rating_desc" : ""));
    f.in_stock = !!fd.get("in_stock"); clearTimeout(shopTimer); shopTimer = setTimeout(loadShop, 250);
  });
  $("#grid").addEventListener("change", (e) => { const id = e.target.dataset && e.target.dataset.cmp; if (!id) return;
    if (e.target.checked) { if (S.selected.size >= 3) { e.target.checked = false; return; } S.selected.add(id); } else S.selected.delete(id); renderCmpBar(); });
}

/* ---------- global events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-ask],[data-filter],[data-open],[data-elig],[data-category-pick]"); if (!t) return;
  if (t.dataset.ask) { S.pendingAsk = t.dataset.ask; $("#overlay").innerHTML = ""; if (location.hash === "#/assistant") route(); else location.hash = "#/assistant"; }
  else if (t.dataset.categoryPick) { S.shop.category = S.shop.category === t.dataset.categoryPick ? "" : t.dataset.categoryPick; const cat = $("#fcat"); if (cat) cat.value = S.shop.category; loadShop(); }
  else if (t.dataset.filter) { S.orderFilter = t.dataset.filter; route(); }
  else if (t.dataset.open) { history.replaceState(null, "", "#/orders/" + t.dataset.open); openDrawer(t.dataset.open); }
  else if (t.dataset.elig) { $("#overlay").innerHTML = ""; openEligibility(t.dataset.elig); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr[data-open]")) { history.replaceState(null, "", "#/orders/" + e.target.dataset.open); openDrawer(e.target.dataset.open); } });
document.addEventListener("input", (e) => { if (e.target.id === "osearch") { S.orderSearch = e.target.value; const pos = e.target.selectionStart; route().then(() => { const i = $("#osearch"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); } });
window.addEventListener("hashchange", route);
$("#logout").onclick = async () => { await post("/api/auth/logout"); location.href = "/login"; };
$("#assistantFab").onclick = () => { S.pendingAsk = ""; location.hash = "#/assistant"; };

(async function init() {
  try {
    S.me = await api("/api/me"); S.orders = (await api("/api/orders")).orders;
    $("#who").innerHTML = `<b>${esc(S.me.customer.name)}</b><span>${S.me.customer.city ? esc(S.me.customer.city) + ", " : ""}${esc(S.me.customer.customer_id)}</span>`;
    const l = S.me.llm, pill = $("#llmPill"); pill.className = "pill" + (l.ok ? "" : " bad"); pill.title = l.message;
    pill.querySelector("span").textContent = l.ok ? l.model : "AI model not ready";
    if (!l.ok) S.chat.push({ role: "err", text: l.message });
    route();
  } catch (e) { $("#view").innerHTML = `<p class="empty txt-bad">${esc(e.message)}</p>`; }
})();
</script>
